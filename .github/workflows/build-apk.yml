name: Build MoneyMap APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK (ANDROID_HOME); AGP installs any missing platform.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testStandardDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleStandardDebug assembleFullDebug

      - name: Lint
        run: ./gradlew --no-daemon lintStandardDebug lintFullDebug

      # Room writes app/schemas/<db>/<version>.json during the build; a changed or new file means the schema
      # history wasn't committed. The file is printed so it can be copied from the log.
      - name: Check Room schemas are committed
        run: |
          changed=$(git status --porcelain -- app/schemas)
          if [ -n "$changed" ]; then
            echo "::error::Room schema files are missing or out of date. Commit these files:"
            echo "$changed"
            git ls-files --others --exclude-standard -- app/schemas | while read -r f; do
              echo "----- BEGIN $f -----"; cat "$f"; echo "----- END $f -----"
            done
            git diff -- app/schemas
            exit 1
          fi

      # Signed with the release key when the MONEYMAP_* secrets are set, otherwise with the debug key.
      - name: Build release APK
        env:
          MONEYMAP_KEYSTORE_BASE64: ${{ secrets.MONEYMAP_KEYSTORE_BASE64 }}
          MONEYMAP_KEYSTORE_PASSWORD: ${{ secrets.MONEYMAP_KEYSTORE_PASSWORD }}
          MONEYMAP_KEY_ALIAS: ${{ secrets.MONEYMAP_KEY_ALIAS }}
          MONEYMAP_KEY_PASSWORD: ${{ secrets.MONEYMAP_KEY_PASSWORD }}
        run: |
          if [ -n "$MONEYMAP_KEYSTORE_BASE64" ]; then
            echo "$MONEYMAP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export MONEYMAP_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon assembleStandardRelease assembleFullRelease

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: moneymap-release-apk
          path: app/build/outputs/apk/*/release/*.apk

      # Standard: installs normally. Full: adds the notification reader (Play Protect blocks it when sideloaded).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moneymap-debug-apk
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: moneymap-full-debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk

      - name: Screenshots
        run: ./gradlew --no-daemon testStandardDebugUnitTest -Pscreenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: moneymap-screenshots
          path: app/build/screenshots/

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneymap-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
